<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fish Feeder Local Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f4f8; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #2c3e50; }
        .btn-pakan { background: linear-gradient(135deg, #1abc9c, #16a085); color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 80%; margin: 20px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #7f8c8d; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-otomatis { background-color: #d5f5e3; color: #1e8449; }
        .badge-manual { background-color: #fdebd0; color: #b9770e; }
    </style>
</head>
<body>

<div class="container">
    <h1>🐠 Smart Fish Feeder</h1>
    <p style="color: #7f8c8d;">Sistem Pakan Mandiri (Tanpa Cloud Cloud Club)</p>

    <button class="btn-pakan" onclick="beriPakanPaksa()">Beri Pakan Paksa!</button>

    <div style="margin-top: 30px;">
        <h3>📜 Riwayat Waktu Pemberian Pakan</h3>
        <table>
            <thead>
                <tr>
                    <th>Waktu Kejadian (RTC Wokwi)</th>
                    <th>Metode</th>
                </tr>
            </thead>
            <tbody id="tabel-histori">
                <tr><td colspan="2" style="text-align:center; color:#95a5a6;">Memuat data dari ESP32...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ⚠️ NYALAKAN WOKWI TERLEBIH DAHULU, LIHAT IP ADDRESS DI SERIAL MONITOR, LALU PASTE DI SINI!
    // Contoh format: "http://10.0.0.2" (Tergantung IP yang didapat dari simulator Wokwi)
    const ESP32_IP = "MASUKKAN_IP_ADDRESS_WOKWI_KAMU"; 

    function beriPakanPaksa() {
        fetch(`${ESP32_IP}/paksa`)
        .then(() => {
            alert("Sukses! Perintah diterima langsung oleh ESP32.");
            setTimeout(ambilHistori, 1000);
        })
        .catch(() => alert("Gagal konek ke ESP32. Pastikan Wokwi sudah di-Play dan IP-nya benar!"));
    }

    function ambilHistori() {
        fetch(`${ESP32_IP}/histori`)
        .then(res => res.json())
        .then(data => {
            const tabel = document.getElementById("tabel-histori");
            tabel.innerHTML = "";
            data.forEach(log => {
                let badge = log.metode === "OTOMATIS" ? 
                    `<span class="badge badge-otomatis">OTOMATIS</span>` : 
                    `<span class="badge badge-manual">MANUAL</span>`;
                tabel.innerHTML += `<tr><td>${log.waktu} WIB</td><td>${badge}</td></tr>`;
            });
            if(data.length === 0) tabel.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#95a5a6;">Belum ada data pakan.</td></tr>';
        })
        .catch(err => console.log("ESP32 belum siap/offline."));
    }

    // Ambil histori tiap 4 detik sekali
    setInterval(ambilHistori, 4000);
</script>
</body>
</html>
