<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fish Feeder - MQTT Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f4f8; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .status-mqtt { font-size: 14px; font-weight: bold; margin-bottom: 20px; padding: 5px 10px; border-radius: 4px; display: inline-block; }
        .online { background-color: #d5f5e3; color: #1e8449; }
        .offline { background-color: #fadbd8; color: #78281f; }
        .btn-pakan { background: linear-gradient(135deg, #1abc9c, #16a085); color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 80%; box-shadow: 0 5px 15px rgba(22, 160, 133, 0.3); }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #7f8c8d; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-otomatis { background-color: #d5f5e3; color: #1e8449; }
        .badge-manual { background-color: #fdebd0; color: #b9770e; }
        .btn-clear { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; float: right; }
    </style>
</head>
<body>

<div class="container">
    <h1>🐠 Smart Fish Feeder</h1>
    <p style="color: #7f8c8d; margin: 5px 0 15px 0;">Protokol MQTT + Memori Anti-Refresh</p>
    
    <div id="status-label" class="status-mqtt offline">Menghubungkan ke Broker MQTT...</div>
    <br>
    <button class="btn-pakan" onclick="beriPakanPaksa()">Beri Pakan Paksa!</button>

    <div style="margin-top: 30px;">
        <h3 style="text-align: left;">
            📜 Riwayat Aktivitas Pakan
            <button class="btn-clear" onclick="hapusSemuaHistori()">Hapus Riwayat</button>
        </h3>
        <table>
            <thead>
                <tr>
                    <th>Waktu Real-time</th>
                    <th>Metode Pemberian</th>
                </tr>
            </thead>
            <tbody id="tabel-histori">
                <!-- Data bakal diisi otomatis via JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // ⚠️ SAMAKAN NAMA TOPIK UNIK KAMU DENGAN YANG DI WOKWI!
    const TOPIC_PREFIX = "cotswoldies"; 

    const broker = "wss://broker.hivemq.com:8884/mqtt";
    const client = mqtt.connect(broker);

    const statusLabel = document.getElementById("status-label");
    const tabelHistori = document.getElementById("tabel-histori");

    // Array penampung histori pakan
    let listHistori = [];

    // 1. Fungsi memuat data lama dari memori browser saat pertama kali web dibuka
    function muatHistoriDariMemori() {
        const dataLokal = localStorage.getItem("riwayat_pakan_ikan");
        if (dataLokal) {
            listHistori = JSON.parse(dataLokal);
            tampilkanKeTabel();
        } else {
            tabelHistori.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#95a5a6;">Belum ada aktivitas pakan terdeteksi...</td></tr>';
        }
    }

    // 2. Fungsi merender isi array ke tabel HTML
    function tampilkanKeTabel() {
        tabelHistori.innerHTML = "";
        listHistori.forEach(item => {
            let badge = item.metode === "OTOMATIS" ? 
                `<span class="badge badge-otomatis">OTOMATIS (Jadwal)</span>` : 
                `<span class="badge badge-manual">MANUAL (Tombol Web)</span>`;
            
            const baris = `<tr><td>${item.waktu} WIB</td><td>${badge}</td></tr>`;
            tabelHistori.innerHTML += baris;
        });
    }

    // 3. Fungsi menghapus riwayat kalau tabelnya kepenuhan
    function hapusSemuaHistori() {
        if(confirm("Apakah kamu yakin ingin menghapus semua riwayat?")) {
            listHistori = [];
            localStorage.removeItem("riwayat_pakan_ikan");
            tabelHistori.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#95a5a6;">Belum ada aktivitas pakan terdeteksi...</td></tr>';
        }
    }

    client.on('connect', () => {
        statusLabel.innerText = "Koneksi MQTT: ONLINE (Siap Kilat)";
        statusLabel.className = "status-mqtt online";
        client.subscribe(`${TOPIC_PREFIX}/pakan/status`);
    });

    client.on('error', (err) => {
        statusLabel.innerText = "Koneksi MQTT: GAGAL";
        statusLabel.className = "status-mqtt offline";
    });

    function beriPakanPaksa() {
        if (client.connected) {
            client.publish(`${TOPIC_PREFIX}/pakan/kontrol`, 'MAKAN_PAKSA');
            alert("Sinyal MQTT terkirim! Servo akan berputar saat ini juga.");
        } else {
            alert("Gagal mengirim! Koneksi ke MQTT Broker terputus.");
        }
    }

    // 4. Menerima laporan sukses dari ESP32
    client.on('message', (topic, message) => {
        if (topic === `${TOPIC_PREFIX}/pakan/status`) {
            const metodeData = message.toString();
            
            const waktuLokal = new Date().toLocaleString('id-ID', {
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                day: 'numeric', month: 'short', year: 'numeric'
            });

            // Masukkan data baru di urutan paling atas array
            listHistori.unshift({ waktu: waktuLokal, metode: metodeData });

            // Batasi memori maksimal simpan 50 riwayat aja biar browser gak lemot
            if (listHistori.length > 50) {
                listHistori.pop();
            }

            // Simpan ke memori permanen browser lokal
            localStorage.setItem("riwayat_pakan_ikan", JSON.stringify(listHistori));
            
            // Perbarui tabel secara live
            tampilkanKeTabel();
        }
    });

    // Jalankan pemuatan data saat web di-refresh/dibuka
    muatHistoriDariMemori();
</script>
</body>
</html>
