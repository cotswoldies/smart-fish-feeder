<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fish Feeder - Multi-Device Sync</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f4f8; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .status-mqtt { font-size: 14px; font-weight: bold; margin-bottom: 20px; padding: 5px 10px; border-radius: 4px; display: inline-block; }
        .online { background-color: #d5f5e3; color: #1e8449; }
        .offline { background-color: #fadbd8; color: #78281f; }
        .counter-box { background-color: #ebf5fb; color: #2980b9; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-bottom: 20px; border: 1px solid #a9cce3;}
        .btn-pakan { background: linear-gradient(135deg, #1abc9c, #16a085); color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 80%; box-shadow: 0 5px 15px rgba(22, 160, 133, 0.3); margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #7f8c8d; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-otomatis { background-color: #d5f5e3; color: #1e8449; }
        .badge-manual { background-color: #fdebd0; color: #b9770e; }
        .btn-clear { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; float: right; }
    </style>
</head>
<body>

<div class="container">
    <h1>Smart Fish Feeder</h1>
    <p style="color: #7f8c8d; margin: 5px 0 15px 0;">Protokol MQTT + Full Multi-Device Sync</p>
    
    <div id="status-label" class="status-mqtt offline">Menghubungkan ke Broker MQTT...</div>
    <div id="counter-label" class="counter-box">Menunggu sinkronisasi data dari alat...</div>
    
    <button class="btn-pakan" onclick="beriPakanPaksa()">Beri Pakan Paksa!</button>

    <div style="margin-top: 30px;">
        <h3 style="text-align: left;">
            Riwayat Aktivitas Terpusat
            <button class="btn-clear" onclick="hapusSemuaHistori()">Hapus Tampilan</button>
        </h3>
        <table>
            <thead>
                <tr>
                    <th>Waktu Real-time</th>
                    <th>Metode Pemberian</th>
                </tr>
            </thead>
            <tbody id="tabel-histori">
                <tr><td colspan="2" style="text-align:center; color:#95a5a6;">Memuat riwayat dari mesin ESP32...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const broker = "wss://broker.hivemq.com:8884/mqtt";
    const client = mqtt.connect(broker);

    const statusLabel = document.getElementById("status-label");
    const counterLabel = document.getElementById("counter-label");
    const tabelHistori = document.getElementById("tabel-histori");

    let riwayatWaktuLokal = [];

    // Muat arsip waktu yang sudah pernah dicatat oleh browser ini sebelumnya
    function muatArsipWaktu() {
        const dataSimpanan = localStorage.getItem("arsip_waktu_pakan");
        if(dataSimpanan) {
            riwayatWaktuLokal = JSON.parse(dataSimpanan);
        }
    }

    function hapusSemuaHistori() {
        if(confirm("Hapus riwayat tampilan di browser ini? (Data di mesin ESP32 tetap aman)")) {
            riwayatWaktuLokal = [];
            localStorage.removeItem("arsip_waktu_pakan");
            tampilkanKeTabel([]);
        }
    }

    function tampilkanKeTabel(arrayHistoriMesin) {
        tabelHistori.innerHTML = "";
        
        if(!arrayHistoriMesin || arrayHistoriMesin.length === 0 || arrayHistoriMesin[0] === "") {
            tabelHistori.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#95a5a6;">Belum ada riwayat aktivitas di mesin...</td></tr>';
            return;
        }

        const penandaWaktuBaru = [];
        const waktuSekarang = new Date().toLocaleString('id-ID', {
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            day: 'numeric', month: 'short', year: 'numeric'
        });

        // Loop dari data terlama ke terbaru untuk mencocokkan/membuat stempel waktu
        for(let i = 0; i < arrayHistoriMesin.length; i++) {
            let tipe = arrayHistoriMesin[i];
            
            // Jika browser sudah punya catatan waktu untuk indeks ini, pakai yang lama. 
            // Jika belum ada (karena device baru dibuka), buatkan waktu saat ini.
            let waktuCetak = riwayatWaktuLokal[i] ? riwayatWaktuLokal[i] : waktuSekarang + " (Synced)";
            penandaWaktuBaru.push(waktuCetak);
        }

        // Perbarui penyimpanan lokal agar sinkron ke depannya
        riwayatWaktuLokal = penandaWaktuBaru;
        localStorage.setItem("arsip_waktu_pakan", JSON.stringify(riwayatWaktuLokal));

        // Render ke tabel secara terbalik (Terbaru di atas)
        for(let i = arrayHistoriMesin.length - 1; i >= 0; i--) {
            let tipe = arrayHistoriMesin[i];
            let badge = tipe === "OTOMATIS" ? 
                `<span class="badge badge-otomatis">OTOMATIS (Jadwal)</span>` : 
                `<span class="badge badge-manual">MANUAL (Tombol Web)</span>`;
            
            const baris = `<tr><td>${riwayatWaktuLokal[i]}</td><td>${badge}</td></tr>`;
            tabelHistori.innerHTML += baris;
        }
    }

    client.on('connect', () => {
        statusLabel.innerText = "Koneksi MQTT: ONLINE";
        statusLabel.className = "status-mqtt online";
        client.subscribe("cotswoldies/pakan/status");
        
        setTimeout(() => {
            client.publish("cotswoldies/pakan/kontrol", "MINTA_DATA");
        }, 1000);
    });

    client.on('error', (err) => {
        statusLabel.innerText = "Koneksi MQTT: GAGAL";
        statusLabel.className = "status-mqtt offline";
    });

    function beriPakanPaksa() {
        if (client.connected) {
            client.publish("cotswoldies/pakan/kontrol", 'MAKAN_PAKSA');
        } else {
            alert("Gagal! Koneksi terputus.");
        }
    }

    client.on('message', (topic, message) => {
        if (topic === "cotswoldies/pakan/status") {
            const msgStr = message.toString();
            
            if(msgStr.startsWith("SYNC_OTOMATIS:")) {
                const jumlahOtomatis = msgStr.split(":")[1];
                counterLabel.innerText = `Total Pakan Otomatis Berhasil Di-eksekusi Alat: ${jumlahOtomatis} Kali`;
            } 
            
            else if(msgStr.startsWith("LIST_HISTORI:")) {
                const isiData = msgStr.split(":")[1];
                const arrayHistori = isiData ? isiData.split(",") : [];
                tampilkanKeTabel(arrayHistori);
            }
        }
    });

    muatArsipWaktu();
</script>
</body>
</html>
