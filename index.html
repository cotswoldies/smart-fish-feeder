<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fish Feeder Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p.subtitle { color: #7f8c8d; margin-bottom: 30px; }
        
        .control-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .btn-pakan {
            background: linear-gradient(135deg, #1abc9c, #16a085);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(22, 160, 133, 0.3);
            transition: all 0.3s ease;
            width: 80%;
        }
        .btn-pakan:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(22, 160, 133, 0.4);
        }
        .btn-hapus {
            background: none;
            border: 2px solid #e74c3c;
            color: #e74c3c;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-hapus:hover {
            background-color: #e74c3c;
            color: white;
        }
        
        .history-section { margin-top: 40px; text-align: left; }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        h3 { color: #34495e; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #7f8c8d; font-size: 14px; }
        td { font-size: 15px; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-otomatis { background-color: #d5f5e3; color: #1e8449; }
        .badge-manual { background-color: #fdebd0; color: #b9770e; }
    </style>
</head>
<body>

<div class="container">
    <h1>🐠 Smart Fish Feeder</h1>
    <p class="subtitle">Kasih Makan Ikan Adit Secara Otomatis!</p>

    <div class="control-area">
        <button class="btn-pakan" onclick="beriPakanPaksa()">Beri Pakan Paksa!</button>
    </div>

    <div class="history-section">
        <div class="history-header">
            <h3>📜 Riwayat Pemberian Pakan</h3>
            <button class="btn-hapus" onclick="hapusTampilanHistori()">Hapus Histori</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Waktu (Tanggal & Jam)</th>
                    <th>Metode</th>
                </tr>
            </thead>
            <tbody id="tabel-histori">
                <tr>
                    <td colspan="2" style="text-align:center; color:#95a5a6;">Memuat data...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // API Keys Resmi Kamu Sudah Dipasang di Sini
    const channelID = "3448220"; 
    const readKey  = "DL0M6SKO1Z65P72B"; 

    let sembunyikanData = false;

    function beriPakanPaksa() {
    // TalkBack ID resmi kamu sudah dipasang di sini!
    const talkBackID = "57504"; 
    
    // ⚠️ SILAKAN MASUKKAN TALKBACK API KEY MILIKMU DI SINI (Lihat di menu Apps -> TalkBack di ThingSpeak)
    const talkBackKey = "MASUKKAN_TALKBACK_API_KEY_MU"; 
    
    // Menggunakan jalur GET request parameter agar 100% aman dan lolos dari blokir CORS browser
    const url = `https://api.thingspeak.com/talkbacks/${talkBackID}/commands.json?api_key=${talkBackKey}&command_string=MAKAN`;
    
    sembunyikanData = false; 
    
    // Mengirim perintah POST kosong ke URL parameter di atas
    fetch(url, { method: 'POST' })
    .then(response => {
        if(response.ok) {
            alert("Mantap! Perintah pakan paksa sukses masuk antrean TalkBack 57504.");
            setTimeout(ambilHistori, 4000); // Beri jeda 4 detik agar ESP32 sempat merespons sebelum tabel direfresh
        } else {
            // Jalur alternatif cadangan jika POST kosong ditolak oleh beberapa browser
            return fetch(url, { method: 'GET' });
        }
    })
    .then(resG => {
        if(resG && resG.ok) {
            alert("Sukses! Perintah masuk antrean melalui jalur cadangan.");
            setTimeout(ambilHistori, 4000);
        } else if (resG) {
            alert("Gagal memproses kode respons TalkBack.");
        }
    })
    .catch(err => {
        console.error("Error detail:", err);
        alert("Terjadi kendala jaringan saat mengirim ke TalkBack.");
    });
}

    function hapusTampilanHistori() {
        if (confirm("Apakah kamu ingin membersihkan tampilan riwayat pakan di halaman ini?")) {
            sembunyikanData = true;
            document.getElementById("tabel-histori").innerHTML = '<tr><td colspan="2" style="text-align:center; color:#95a5a6;">Riwayat dikosongkan.</td></tr>';
        }
    }

    function ambilHistori() {
        if (sembunyikanData) return; 

        const url = `https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readKey}&results=10`;

        fetch(url)
        .then(res => res.json())
        .then(data => {
            const feeds = data.feeds;
            const tabel = document.getElementById("tabel-histori");
            tabel.innerHTML = ""; 

            feeds.reverse().forEach(feed => {
                if (feed.field1 === null && feed.field2 === null) return;

                const opsiWaktu = { 
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                };
                const waktuLokal = new Date(feed.created_at).toLocaleString('id-ID', opsiWaktu);

                let metode = "";
                if (feed.field1 === "1") {
                    metode = '<span class="badge badge-otomatis">OTOMATIS</span>';
                } else if (feed.field2 === "1") {
                    metode = '<span class="badge badge-manual">MANUAL (Paksa)</span>';
                } else {
                    return; 
                }

                const baris = `<tr>
                    <td>${waktuLokal} WIB</td>
                    <td>${metode}</td>
                </tr>`;
                tabel.innerHTML += baris;
            });
            
            if(tabel.innerHTML === "") {
                tabel.innerHTML = '<tr><td colspan="2" style="text-align:center;">Belum ada riwayat.</td></tr>';
            }
        })
        .catch(err => console.error("Gagal memuat histori:", err));
    }

    ambilHistori();
    setInterval(ambilHistori, 15000); 
</script>

</body>
</html>
